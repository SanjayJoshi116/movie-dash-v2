name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - run: npm run lint

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Lint Python scripts (ruff)
        run: |
          pip install -r requirements-dev.txt
          ruff check movie-search.py backfill_posters.py

      - name: Type-check server
        run: npm run type-check:server

      - run: npm run build

      - name: Bundle budget (landing JS <= 400 kB gzip, no chunk > 500 kB)
        run: npm run check:bundle

      - name: Server tests
        run: npm run test:server

      - name: Seed CSV fixture
        run: cp public/movies.template.csv src/movies.csv

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
